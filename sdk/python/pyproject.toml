[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "unit-economics"
version = "0.1.0"
description = "Python client for the unit-economics ingestion API: batched, retried, idempotent usage events"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alessandro Paolo Alghisi" }]
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["unit_economics*"]

[tool.setuptools.package-data]
unit_economics = ["py.typed"]
